<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero photo placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0F1419"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FAF7F2" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#grid)"/>
  <g transform="translate(320 400)" fill="#FAF7F2" opacity="0.4" text-anchor="middle">
    <circle r="60" fill="none" stroke="#D97706" stroke-width="2"/>
    <text y="8" font-family="serif" font-size="32" font-style="italic" fill="#D97706">photo</text>
    <text y="100" font-family="sans-serif" font-size="13" letter-spacing="3" fill="#FAF7F2" opacity="0.7">REPLACE WITH JOB PHOTO</text>
    <text y="125" font-family="sans-serif" font-size="11" letter-spacing="2" fill="#FAF7F2" opacity="0.4">640 × 800 · WebP</text>
  </g>
</svg>
